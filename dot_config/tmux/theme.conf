setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-border-style "bg=default,fg=#{@thm_overlay0}"
setw -g pane-active-border-style "bg=default,fg=#{@thm_surface0}"
setw -g pane-border-lines single
set -g window-status-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-style "bg=default,fg=#{@thm_blue}"
set -g window-status-last-style "bg=default,fg=#{@thm_blue},bold"
set -g window-status-activity-style "bg=#{@thm_mauve},fg=#{@thm_base}"
set -g window-status-bell-style "bg=#{@thm_maroon},fg=#{@thm_base},bold"
set -gF window-status-separator "#[bg=default,fg=#{@thm_overlay0}]│"
set -g window-status-current-format " #I#{?#{!=:#{window_name},Window},: #W,} "
set -g window-status-current-style "bg=#{@thm_blue},fg=#{@thm_base},bold"
