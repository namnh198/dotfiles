add_newline = false
#format = "$directory$git_branch$git_status$fill$php$python$lua$nodejs$docker_context$jobs$cmd_duration$line_break$character"
format = """$directory$character"""
palette = "catppuccin_mocha"
# move the rest of the prompt to the right
right_format = """$all"""
scan_timeout = 1000
command_timeout = 1000

[character]
vicmd_symbol = "[N] >>>"
error_symbol = "[✗](bold red)"
success_symbol = "[➜](bold green)"

[directory]
read_only = " 󰍁"

[directory.substitutions]
'~/Developer' = 'work-project'

[fill]
symbol = " "

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style)"
symbol = " "

[golang]
format = '[  ](bold lavender)'

[docker_context]
disabled = true

[bun]
disabled = true

[kubernetes]
symbol = '☸ '
disabled = true
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '
contexts = [
  { context_pattern = "arn:aws:eks:us-west-2:577926974532:cluster/zd-pvc-omer", style = "green", context_alias = "omerxx", symbol = " " },
]

[aws]
format = '[$symbol(profile: "$profile" )(\(region: $region\) )]($style)'
disabled = false
style = 'bold blue'
symbol = " "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

