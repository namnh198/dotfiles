config-version = 2
after-startup-command = []

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

on-mode-changed = []

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.bottom = 5
outer.top = 5
outer.right = 5

[mode.main.binding]
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1' # Built in retinal display
alt-2 = 'workspace 2' # Display Samsung S8
alt-a = 'workspace A' # Any: Docker, TablePlus, etc
alt-b = 'workspace B' # Browser
alt-c = 'workspace C' # Coding
alt-d = 'workspace D' # Document, Finder, etc
alt-g = 'workspace G' # Game
alt-m = 'workspace M' # Music, Spotify
alt-n = 'workspace N' # Notes, Obsidian
alt-r = 'workspace R' # Reading
alt-s = 'workspace S' # Settings
alt-t = 'workspace T' # Terminal
alt-v = 'workspace V' # Video editing
alt-w = 'workspace W' # Work, Email
alt-x = 'workspace X' # VMWare

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-a = 'move-node-to-workspace A'
alt-shift-b = 'move-node-to-workspace B'
alt-shift-c = 'move-node-to-workspace C'
alt-shift-d = 'move-node-to-workspace D'
alt-shift-g = 'move-node-to-workspace G'
alt-shift-m = 'move-node-to-workspace M'
alt-shift-n = 'move-node-to-workspace N'
alt-shift-r = 'move-node-to-workspace R'
alt-shift-s = 'move-node-to-workspace S'
alt-shift-t = 'move-node-to-workspace T'
alt-shift-v = 'move-node-to-workspace V'
alt-shift-w = 'move-node-to-workspace W'
alt-shift-x = 'move-node-to-workspace X'

alt-shift-f = 'fullscreen'
alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = [
  'layout floating tiling',
  'mode main',
] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

alt-shift-h = ['join-with left', 'mode main']
alt-shift-j = ['join-with down', 'mode main']
alt-shift-k = ['join-with up', 'mode main']
alt-shift-l = ['join-with right', 'mode main']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ["layout floating", "move-node-to-workspace T"]

[[on-window-detected]]
if.app-id = 'company.thebrowser.dia'
run = "move-node-to-workspace B"
[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = "move-node-to-workspace B"

[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = "move-node-to-workspace C"
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = "move-node-to-workspace C"

[[on-window-detected]]
if.app-id = 'io.playcover.PlayCover'
run = ['layout floating', 'move-node-to-workspace G']
[[on-window-detected]]
if.app-id = 'jp.pokemon.pokemonchampions'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Preview'
run = "move-node-to-workspace R"

[[on-window-detected]]
if.app-id = 'com.apple.iBooksX'
run = "move-node-to-workspace R"

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = "move-node-to-workspace N"
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = "move-node-to-workspace N"
[[on-window-detected]]
if.app-id = 'club.refactoring.tolaria'
run = 'move-node-to-workspace N'
[[on-window-detected]]
if.app-id = "com.apple.reminders"
run = "move-node-to-workspace N"

[[on-window-detected]]
if.app-id = 'com.vmware.fusion'
run = 'move-node-to-workspace X'
[[on-window-detected]]
if.app-id = 'dev.kdrag0n.MacVirt'
run = 'move-node-to-workspace X'

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = ['layout floating', 'move-node-to-workspace S']

[[on-window-detected]]
if.app-id = 'ai.elementlabs.lmstudio'
run = ['layout floating', 'move-node-to-workspace W']
[[on-window-detected]]
if.app-id = 'com.electron.ollama'
run = 'move-node-to-workspace S'
[[on-window-detected]]
if.app-id = 'com.desktop.Telegram'
run = ['layout floating', 'move-node-to-workspace W']

#which work space is on which monitor
[workspace-to-monitor-force-assignment]
W = 1
C = 'secondary'
X = 'secondary'
D = 'main'
S = 'main'
